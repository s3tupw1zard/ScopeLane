name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure trusted-publishing npm version
        run: npm install --global "npm@^11.21.0"

      - name: Install dependencies
        run: bun install

      - name: Validate release version
        id: package
        shell: bash
        run: |
          VERSION="$(node --input-type=module -e \"import pkg from './package.json' with { type: 'json' }; process.stdout.write(pkg.version)\")"
          EXPECTED_TAG="v${VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must match package version ${EXPECTED_TAG}." >&2
            exit 1
          fi

          if [[ "${VERSION}" == *-* ]]; then
            DIST_TAG="dev"
          else
            DIST_TAG="latest"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "dist_tag=${DIST_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Verify package
        run: bun run verify

      - name: Publish package
        run: npm publish --access public --tag "${{ steps.package.outputs.dist_tag }}"
