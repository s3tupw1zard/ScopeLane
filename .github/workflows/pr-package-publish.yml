name: PR npm package publish

on:
  workflow_run:
    workflows: ["PR npm package build"]
    types: [completed]

permissions: {}

jobs:
  authorize:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.allow.outputs.allowed }}
      pr_number: ${{ steps.allow.outputs.pr_number }}
    steps:
      - id: allow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTRA_ALLOWED_ACTORS: ${{ vars.PR_PACKAGE_ALLOWED_ACTORS }}
          EXTRA_ALLOWED_PRS: ${{ vars.PR_PACKAGE_ALLOWED_PRS }}
        run: |
          set -euo pipefail

          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [[ -z "$pr_number" ]]; then
            echo "::warning::Triggering workflow run is not associated with a pull request."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          author="$(jq -r '.user.login' <<<"$pr_json")"
          approved_label="$(jq -r '[.labels[].name] | index("pr-package-approved") != null' <<<"$pr_json")"

          allowed=false
          for candidate in s3tupw1zard ${EXTRA_ALLOWED_ACTORS//,/ }; do
            [[ -n "$candidate" ]] || continue
            if [[ "${candidate,,}" == "${author,,}" ]]; then
              allowed=true
              break
            fi
          done

          if [[ "$allowed" != "true" ]]; then
            for candidate in ${EXTRA_ALLOWED_PRS//,/ }; do
              [[ -n "$candidate" ]] || continue
              if [[ "$candidate" == "$pr_number" ]]; then
                allowed=true
                break
              fi
            done
          fi

          if [[ "$allowed" != "true" && "$approved_label" == "true" ]]; then
            allowed=true
          fi

          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

          if [[ "$allowed" != "true" ]]; then
            echo "::notice::Skipping PR package publish for unapproved author $author"
          fi

  publish:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-npm-scopelane
          path: package
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate package artifact
        shell: bash
        env:
          EXPECTED_NAME: "@s3tupw1zard/opencode-scopelane"
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          BUILD_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          BUILD_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          tarball="package/package.tgz"
          manifest="$(tar -xOf "$tarball" package/package.json)"
          actual_name="$(node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(0,"utf8")).name)' <<<"$manifest")"
          actual_version="$(node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(0,"utf8")).version)' <<<"$manifest")"

          [[ "$actual_name" == "$EXPECTED_NAME" ]] || {
            echo "Unexpected package name: $actual_name" >&2
            exit 1
          }

          [[ "$actual_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-pr\.${PR_NUMBER}\.${BUILD_RUN_NUMBER}\.${BUILD_RUN_ATTEMPT}$ ]] || {
            echo "Unexpected preview version: $actual_version" >&2
            exit 1
          }

          echo "Validated $actual_name@$actual_version"

      - name: Set up GitHub Packages registry
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@s3tupw1zard"
          package-manager-cache: false

      - name: Publish PR package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
        run: npm publish package/package.tgz --ignore-scripts --registry=https://npm.pkg.github.com --tag "pr-${PR_NUMBER}"
